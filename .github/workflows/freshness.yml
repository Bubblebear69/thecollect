# The Collect — freshness watchdog.
# Runs on GitHub's servers (NOT Blair's machine) every hour and fails
# loudly if the published data is more than ~2 hours old. On failure it
# pings Slack (#ops-alerts) AND GitHub emails the repo owner. The point:
# we learn the engine's machine has gone dark — even if the whole droplet
# is down so the engine itself can't raise an alert — before a customer does.
name: freshness
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: data must be fresh
        run: |
          gen=$(curl -s https://thecollect.nz/app/data.json | python3 -c \
            "import json,sys; print(json.load(sys.stdin)['generated_at'])")
          age=$(( $(date -u +%s) - $(date -u -d "$gen" +%s) ))
          echo "published: $gen — age: $((age/60)) minutes"
          echo "GEN=$gen" >> "$GITHUB_ENV"
          echo "AGE_MIN=$((age/60))" >> "$GITHUB_ENV"
          if [ "$age" -gt 7800 ]; then
            echo "::error::thecollect.nz data is $((age/60)) minutes old — the engine machine is asleep or the pipeline is broken"
            exit 1
          fi
      - name: alert Slack if stale
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *[CRITICAL]* thecollect.nz has STOPPED updating — published data is ${AGE_MIN:-unknown} min old (last: ${GEN:-unknown}). The engine/droplet may be down. — GitHub freshness watchdog\"}" \
            "${{ secrets.SLACK_WEBHOOK }}"
