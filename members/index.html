<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Collect — members</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../app/icon.svg" type="image/svg+xml" />
<style>
  :root{
    --ink:#0E1217; --card:#161E27; --line:rgba(212,175,55,.16);
    --gold:#D4AF37; --gold-hi:#F0D078; --turf:#1C8A50; --turf-deep:#0B3D2E;
    --paper:#F2EAD3; --dim:rgba(242,234,211,.68); --faint:rgba(242,234,211,.42);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--ink); color:var(--paper);
        font:15.5px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a{ color:var(--gold); text-decoration:none; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 20px; }

  .top{ position:sticky; top:0; z-index:50; background:rgba(14,18,23,.94);
        backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top .wrap{ display:flex; align-items:center; gap:12px; height:60px; }
  .top img{ width:32px; height:32px; border-radius:8px; }
  .top .name{ font-family:Georgia,serif; font-weight:700; font-size:17px; }
  .top .spacer{ flex:1; }
  .top a.plain{ color:var(--dim); font-size:13.5px; margin-left:14px; }

  .tabs{ display:flex; gap:6px; margin:22px 0 6px; flex-wrap:wrap; }
  .tabs button{ background:var(--card); color:var(--dim); border:1px solid var(--line);
        border-radius:999px; padding:9px 20px; font-size:14px; font-weight:700;
        cursor:pointer; }
  .tabs button.on{ background:linear-gradient(135deg,var(--gold-hi),var(--gold));
        color:#171204; border-color:transparent; }

  h2{ font-family:Georgia,serif; font-size:24px; margin:22px 0 4px; }
  .sub{ color:var(--faint); font-size:13px; margin-bottom:14px; }

  .meeting{ background:var(--card); border:1px solid var(--line); border-radius:16px;
            padding:20px 22px; margin-bottom:18px; }
  .meeting > h3{ font-size:18px; display:flex; gap:10px; align-items:baseline; }
  .meeting > h3 .cond{ font-size:12px; color:var(--faint); font-weight:400; }
  .race{ border-top:1px solid rgba(242,234,211,.08); margin-top:14px; padding-top:14px; }
  .race-line{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .race-line b{ font-size:15.5px; }
  .race-line .t{ color:var(--faint); font-size:12.5px; }
  .hero-in{ padding:26px 4px 8px; }
  .hero-in h1{ font-family:Georgia,serif; font-size:clamp(28px,5vw,40px);
        line-height:1.12; font-weight:700; }
  .hero-in h1 span{ color:var(--gold); }
  .hero-in .lead{ color:var(--dim); font-size:16px; max-width:640px; margin-top:10px; }
  .tile-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:12px 0; }
  .tile{ background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:16px 14px; text-align:center; }
  .tile .tn{ font-size:clamp(20px,3.4vw,28px); font-weight:800; color:var(--gold-hi);
        font-variant-numeric:tabular-nums; }
  .tile .tl{ font-size:11.5px; color:var(--faint); margin-top:3px; letter-spacing:.3px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px;
        padding:22px 24px; margin:16px 0; }
  .panel h3{ font-family:Georgia,serif; font-size:20px; margin-bottom:10px; }
  ul.how{ list-style:none; display:grid; gap:11px; }
  ul.how li{ padding-left:22px; position:relative; font-size:14.5px; color:var(--dim); }
  ul.how li b{ color:var(--paper); }
  ul.how li::before{ content:"◆"; position:absolute; left:0; color:var(--gold);
        font-size:11px; top:3px; }
  .panel.learn{ background:linear-gradient(135deg,var(--turf-deep),#123526 55%,var(--card));
        border-color:rgba(28,138,80,.4); }
  .panel.learn p{ color:var(--paper); font-size:15px; margin-bottom:10px; }
  .panel.learn b{ color:var(--gold-hi); }
  .cta-in{ text-align:center; margin:8px 0 24px; }
  .go-today{ background:linear-gradient(135deg,var(--gold-hi),var(--gold)); color:#171204;
        border:0; border-radius:10px; padding:13px 26px; font-size:15px; font-weight:800;
        cursor:pointer; }
  @media(max-width:560px){ .tile-row{ grid-template-columns:repeat(3,1fr); }
        .tile .tn{ font-size:19px; } .tile .tl{ font-size:10px; } }
  .meet-pick{ margin:6px 0 4px; padding:11px 14px; border-radius:10px; font-size:15px;
        font-weight:700; background:var(--card); color:var(--paper);
        border:1px solid var(--line); width:100%; max-width:420px; cursor:pointer; }
  .grade{ font-size:12px; font-weight:800; color:#171204; background:var(--gold);
          border-radius:6px; padding:1px 8px; margin-left:8px; vertical-align:2px; }
  .conf-line{ font-size:13px; color:var(--faint); margin:2px 0 4px; font-style:italic; }
  .market-read{ font-size:13.5px; color:var(--paper); margin:6px 0; padding:8px 12px;
        background:rgba(28,138,80,.12); border-left:3px solid var(--turf);
        border-radius:0 8px 8px 0; }
  .runners-head{ font-size:11px; letter-spacing:1px; text-transform:uppercase;
                 color:var(--faint); margin-bottom:4px; }
  .pick{ font-size:17px; font-weight:800; color:var(--gold-hi); margin:6px 0 2px; }
  .pick .star{ color:var(--gold); font-size:12px; font-weight:800;
               border:1px solid var(--line); border-radius:999px; padding:2px 10px;
               margin-left:8px; vertical-align:2px; }
  .why{ color:var(--dim); font-size:14px; max-width:760px; }
  .runners{ margin-top:10px; display:grid; gap:5px; }
  .runner{ display:flex; gap:10px; font-size:13.5px; }
  .runner .no{ min-width:26px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .runner .lab{ min-width:96px; font-weight:700; }
  .runner.pick .lab{ color:var(--gold); }
  .runner.danger .lab{ color:#E07B54; }
  .runner .c{ color:var(--dim); }
  .exotics{ margin-top:10px; font-size:13.5px; color:var(--dim); }
  .exotics b{ color:var(--paper); }

  .chips{ display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
  .chip{ background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:10px 18px; }
  .chip .n{ font-size:21px; font-weight:800; color:var(--gold-hi);
            font-variant-numeric:tabular-nums; }
  .chip .l{ font-size:11px; color:var(--faint); }

  .day{ background:var(--card); border:1px solid var(--line); border-radius:16px;
        padding:18px 20px; margin-bottom:14px; }
  .day summary{ cursor:pointer; list-style:none; display:flex; gap:14px;
                align-items:baseline; flex-wrap:wrap; font-size:15px; }
  .day summary::-webkit-details-marker{ display:none; }
  .day .d{ font-weight:800; min-width:120px; }
  .day .s{ color:var(--dim); }
  .day .b{ color:var(--gold-hi); font-weight:700; margin-left:auto; }
  .board{ margin-top:12px; display:grid; gap:4px; }
  .brow{ display:flex; gap:10px; font-size:13.5px;
         border-top:1px solid rgba(242,234,211,.06); padding-top:4px; }
  .brow .r{ min-width:170px; color:var(--dim); }
  .brow .p{ flex:1; }
  .brow .o{ min-width:90px; text-align:right; font-weight:700; }
  .brow .o.win{ color:var(--gold-hi); }
  .brow .o.plc{ color:var(--turf); }
  .brow .o.no{ color:var(--faint); font-weight:400; }

  .gate{ max-width:420px; margin:80px auto; text-align:center; }
  .gate img{ width:72px; height:72px; border-radius:16px; margin-bottom:16px; }
  .gate h1{ font-family:Georgia,serif; font-size:26px; margin-bottom:8px; }
  .gate p{ color:var(--dim); font-size:14.5px; margin-bottom:18px; }
  .gate input{ width:100%; padding:13px 16px; border-radius:10px; font-size:16px;
        background:var(--card); color:var(--paper); border:1px solid var(--line);
        text-transform:uppercase; text-align:center; letter-spacing:1px; }
  .gate button{ width:100%; margin-top:12px; padding:13px; border-radius:10px;
        border:0; font-weight:800; font-size:15px; cursor:pointer;
        background:linear-gradient(135deg,var(--gold-hi),var(--gold)); color:#171204; }
  .gate .err{ color:#E07B54; font-size:13.5px; margin-top:10px; min-height:18px; }
  footer{ padding:34px 0; color:var(--faint); font-size:12.5px; }
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <img src="../logo.png" alt="" /><span class="name">THE COLLECT · members</span>
  <span class="spacer"></span>
  <a class="plain" href="../app/">Phone app</a>
  <a class="plain" href="../">Public site</a>
</div></div>

<div id="page" class="wrap"></div>

<footer><div class="wrap">R18 · Please gamble responsibly · NZ 0800 654 655 · AU 1800 858 858
  · Opinions based on evidence, not guarantees.</div></footer>

<script>
const DIGESTS = [
  "6027735188474088b3f3068efe27b2dab3a538697e0f9a7ac5e98e44c08868ee",
  "321e0ba4a0d68e5e5ceb3e01af8b76d61cb9481cfddeecb6b736420b305a568d",
  "712bd1b83cd1e0527d0a9e292fcd9ad78e43584c8c40cd68b7a9ee91496d87f0",
];
let DATA = null, ARCHIVE = null, TAB = 'home', MEET = 0;
const page = () => document.getElementById('page');

function wireMeetPick(){
  const sel = document.getElementById('meetPick');
  if (sel) sel.onchange = () => { MEET = parseInt(sel.value, 10) || 0;
                                  renderToday(); };
}

function hasAccess(){ return localStorage.getItem('tc_access') === 'yes'; }

async function checkCode(code){
  const clean = (code||'').trim().toUpperCase();
  if (!clean) return false;
  const buf = await crypto.subtle.digest('SHA-256',
      new TextEncoder().encode(clean));
  const hex = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return DIGESTS.includes(hex);
}

function renderGate(){
  page().innerHTML = `<div class="gate">
    <img src="../logo.png" alt="" />
    <h1>Members only</h1>
    <p>This is the full desk — every meeting, every race, the archive.
       Enter your invite code once and this browser stays signed in.</p>
    <input id="code" placeholder="INVITE CODE" autocomplete="off" />
    <button id="go">Unlock</button>
    <div class="err" id="err"></div>
    <p style="margin-top:16px"><a href="../">Back to the public site</a></p>
  </div>`;
  document.getElementById('go').onclick = async () => {
    if (await checkCode(document.getElementById('code').value)){
      localStorage.setItem('tc_access', 'yes');
      boot();
    } else {
      document.getElementById('err').textContent =
        'That code isn’t recognised. Check it and try again.';
    }
  };
}

function tabs(){
  const t = [['home','Home'],['today','Today’s card'],['results','Results'],
             ['picks','Our picks'],['horses','Horse stats'],
             ['blackbook','Blackbook']];
  return '<div class="tabs">' + t.map(([k,l]) =>
    `<button data-t="${k}" class="${TAB===k?'on':''}">${l}</button>`).join('') +
    '</div>';
}

/* ---------------------------------------------- welcome / home */
let STATS = null;
function nf(n){ return (n||0).toLocaleString('en-NZ'); }
async function renderHome(){
  const d = DATA || {}, w = d.week || {};
  if (!STATS){
    try { STATS = await (await fetch('stats.json',{cache:'no-store'})).json(); }
    catch(e){ STATS = {}; }
  }
  const s = STATS || {};
  const best = (w.best && w.best[0]) ? w.best[0] : null;
  let h = tabs();
  h += `<div class="hero-in">
    <h1>Welcome to <span>The Collect</span></h1>
    <p class="lead">The whole desk is yours — every meeting, every race, the
    reasoning behind every pick, and the honest record to check us on. Here's
    the machine you're now holding.</p>
  </div>`;

  // Live form tiles
  h += '<div class="tile-row">';
  h += tile(w.wins, 'winners this week');
  h += tile((w.win_pct||0).toFixed(1)+'%', 'win strike rate');
  h += tile(best ? '$'+Math.round(best.collect) : '—', 'biggest collect this week');
  h += '</div>';

  // Engine-scale tiles (smoke, but all true)
  h += '<div class="tile-row">';
  h += tile(nf(s.races), 'races analysed');
  h += tile(nf(s.horses), 'horses in our book');
  h += tile(nf(s.assessments), 'runner assessments made');
  h += '</div><div class="tile-row">';
  h += tile(nf(s.sectionals), 'sectional splits held');
  h += tile(nf(s.tracks), 'tracks profiled');
  h += tile(nf(s.meetings), 'meetings covered');
  h += '</div>';

  // How we do it — 5 bullets (small secrets, not the recipe)
  h += `<div class="panel"><h3>How we do what we do</h3><ul class="how">
    <li><b>Around thirty checks on every runner.</b> Class off official
      ratings, career and recent form, track and distance records, the speed
      map, track bias and sectional times — each weighed on its own before a
      single pick is made.</li>
    <li><b>We commit before we look at the odds.</b> The engine locks its order
      on the evidence first; the market only ever gets a small, capped say.
      We're reading the race — not chasing the money.</li>
    <li><b>We read how the race will be run.</b> Who leads, who's stuck wide,
      where the tempo pressure falls. The best horse doesn't win if it can't
      get the trip it needs — so we map that first.</li>
    <li><b>Our strongest signal is agreement.</b> When our top-rated horse is
      also the one the market is backing, that convergence is the sweet spot —
      and it's the pattern we wait for before we star a best bet.</li>
    <li><b>Every result is published, win or lose.</b> The scoreboard you can
      see is the entire business. No deleted losers, no cherry-picked weeks —
      the honesty is the product.</li>
  </ul></div>`;

  // The learning spiel
  h += `<div class="panel learn"><h3>It gets smarter every single race</h3>
    <p>The engine never stops learning. The moment a race is run it feeds
    straight back in: every horse's form is updated, every track's bias is
    re-measured — which barriers and which running styles are winning
    <i>now</i>, not last season — and our own strike-rate is re-checked
    against what actually happened, so the confidence we put on a pick stays
    honest.</p>
    <p>That's the quiet edge. Tomorrow the engine knows more about every horse
    and every track than it did today, and the day after it knows more again.
    It has already read <b>${nf(s.races)} races</b> across
    <b>${nf(s.horses)} horses</b> — and every meeting we cover, that book gets
    deeper and the read gets sharper. You're not buying a tip. You're renting a
    machine that's been doing the form, honestly, every day, and never forgets
    a thing.</p></div>`;

  h += `<div class="cta-in"><button data-t="today" class="go-today">See today's
    full card →</button></div>`;
  page().innerHTML = h;
}
function tile(n, label){
  return `<div class="tile"><div class="tn">${n==null?'—':n}</div>` +
         `<div class="tl">${label}</div></div>`;
}

const CONF_TEXT = {
  "A+": "Top confidence — the evidence and the market both point here.",
  "A":  "High confidence — strong, converging evidence.",
  "B+": "Solid confidence — clearly our horse on the read.",
  "B":  "Moderate confidence — our pick, in a more open race.",
  "C":  "An open race — our pick by a narrow margin.",
};

function renderToday(){
  const d = DATA || {};
  const meets = d.meetings || [];
  if (MEET >= meets.length) MEET = 0;
  let h = tabs();
  h += `<h2>Today — ${d.date||''}</h2>
        <div class="sub">${d.meeting_count||0} meetings · updated
        ${(d.generated_at||'').slice(11,16)} · re-checked to a minute before
        every jump</div>`;

  // Meeting picker
  h += '<select class="meet-pick" id="meetPick">';
  meets.forEach((m, i) => {
    h += `<option value="${i}" ${i===MEET?'selected':''}>${m.track}` +
         ` — ${m.country||''} (${(m.races||[]).length} races)</option>`;
  });
  h += '</select>';

  const m = meets[MEET];
  if (!m){ page().innerHTML = h + '<p class="sub">No meetings loaded yet.</p>';
           wireMeetPick(); return; }

  h += `<div class="meeting"><h3>${m.track}
        <span class="cond">${m.country||''} · ${m.condition||''}</span></h3>`;
  (m.races||[]).forEach(r => {
    const p = r.pick || {};
    const conf = (p.confidence || "").trim();
    h += `<div class="race">
      <div class="race-line"><b>${r.race_no}${r.race_name ? ' · '+r.race_name : ''}</b>
        <span class="t">${r.distance||''} · jumps ${(r.start_time||'').slice(0,5)}</span></div>
      <div class="pick">#${p.number} ${p.horse}
        ${conf ? `<span class="grade">${conf}</span>` : ''}
        ${p.best_bet ? '<span class="star">BEST BET</span>' : ''}
        ${p.firming ? '<span class="star">MONEY COMING</span>' : ''}</div>`;
    if (conf && CONF_TEXT[conf])
      h += `<div class="conf-line">${CONF_TEXT[conf]}</div>`;
    if (p.market_read)
      h += `<div class="market-read">${p.market_read}</div>`;
    if (r.verdict) h += `<div class="why"><b>${r.verdict}</b></div>`;
    if (r.why) h += `<div class="why">${Array.isArray(r.why) ? r.why.join(' ') : r.why}</div>`;
    if (r.runners && r.runners.length){
      h += '<div class="runners"><div class="runners-head">The read on every runner</div>';
      r.runners.forEach(u => {
        h += `<div class="runner ${u.tier||''}">
              <span class="no">${u.number}</span>
              <span class="lab">${u.label||''}</span>
              <span class="c">${u.horse}${u.comment ? ' — ' + u.comment : ''}</span>
              </div>`;
      });
      h += '</div>';
    }
    if (r.exotics){
      const e = r.exotics;
      h += '<div class="exotics">' +
           (e.trifecta ? `<div><b>Trifecta:</b> ${e.trifecta}</div>` : '') +
           (e.first_four ? `<div><b>First four:</b> ${e.first_four}</div>` : '') +
           '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  page().innerHTML = h;
  wireMeetPick();
}

function renderWeek(){
  const w = (DATA||{}).week || {};
  let h = tabs();
  h += `<h2>This week</h2><div class="sub">rolling 7 days, straight from the engine</div>`;
  h += `<div class="chips">
    <div class="chip"><div class="n">${w.wins??'—'}</div><div class="l">winners</div></div>
    <div class="chip"><div class="n">${w.races??'—'}</div><div class="l">races</div></div>
    <div class="chip"><div class="n">${w.win_pct??'—'}%</div><div class="l">strike rate</div></div>
  </div>`;
  if (w.best && w.best.length){
    h += '<div class="meeting"><h3>The board of the week</h3><div class="board" style="margin-top:10px">';
    w.best.forEach(b => {
      h += `<div class="brow"><span class="r">${b.date||''}</span>
            <span class="p">${b.race} — <b>${b.horse}</b> won at $${(b.price||0).toFixed(2)}</span>
            <span class="o win">$${(b.collect||0).toFixed(2)}</span></div>`;
    });
    h += '</div></div>';
  }
  const y = (DATA||{}).yesterday;
  if (y){
    h += `<div class="meeting"><h3>Yesterday — ${y.date}</h3>
      <div class="chips"><div class="chip"><div class="n">${y.wins}</div><div class="l">winners</div></div>
      <div class="chip"><div class="n">${y.win_pct}%</div><div class="l">win strike</div></div>
      <div class="chip"><div class="n">${y.place_pct}%</div><div class="l">top-3 rate</div></div></div></div>`;
  }
  page().innerHTML = h;
}

function renderArchive(){
  const days = (ARCHIVE||{}).days || [];
  let h = tabs();
  h += `<h2>The archive</h2><div class="sub">every day's board, kept honestly —
        the record no tipster shows you</div>`;
  if (!days.length) h += '<p class="sub">The archive builds itself daily — check back tomorrow.</p>';
  days.forEach(day => {
    h += `<details class="day"><summary>
      <span class="d">${day.date}</span>
      <span class="s">${day.wins} winners / ${day.races} races (${day.win_pct}%)</span>
      ${day.best ? `<span class="b">best: ${day.best.horse} $${(day.best.div||0).toFixed(2)}</span>` : ''}
      </summary><div class="board">`;
    (day.board||[]).forEach(r => {
      const cls = r.outcome === 'WON' ? 'win' : (r.outcome === 'unplaced' ? 'no' : 'plc');
      h += `<div class="brow"><span class="r">${r.race}</span>
            <span class="p">${r.pick}</span>
            <span class="o ${cls}">${r.outcome}${r.div ? ' $'+r.div.toFixed(2) : ''}</span></div>`;
    });
    h += '</div></details>';
  });
  page().innerHTML = h;
}

function renderBlackbook(){
  const bb = (DATA||{}).blackbook || {};
  let h = tabs();
  h += `<h2>The Engine's Blackbook</h2><div class="sub">horses the machine says to follow</div>`;
  const block = (title, list, note) => {
    if (!list || !list.length) return '';
    let s = `<div class="meeting"><h3>${title}</h3><div class="sub">${note}</div><div class="board">`;
    list.forEach(x => {
      s += `<div class="brow"><span class="r">${x.seen||''}</span>
            <span class="p"><b>${x.horse}</b>${x.note ? ' — '+x.note : ''}</span></div>`;
    });
    return s + '</div></div>';
  };
  h += block('Quiet achievers', bb.quiet,
             'flashed home at big odds — the market will be slow to catch up');
  h += block('Bias victims', bb.bias,
             'beaten by the track pattern, not by ability');
  if (!(bb.quiet||[]).length && !(bb.bias||[]).length)
    h += '<p class="sub">Nothing qualifying right now — the bar is deliberately high.</p>';
  page().innerHTML = h;
}

function renderTab(){
  if (TAB==='home') return renderHome();
  if (TAB==='results') return renderResults();
  if (TAB==='picks') return renderArchive();
  if (TAB==='horses') return renderHorses();
  if (TAB==='blackbook') return renderBlackbook();
  renderToday();
}

/* ---------------------------------------------- results (all races) */
let RES_DATES = null, RES_SEL = '';
async function renderResults(){
  let h = tabs() + '<h2>Race results</h2>' +
    '<div class="sub">every placing and dividend — today back 60 days</div>';
  if (!RES_DATES){
    page().innerHTML = h + '<p class="sub">Loading dates…</p>';
    try {
      const r = await fetch('results/index.json', {cache:'no-store'});
      RES_DATES = (await r.json()).dates || [];
      RES_SEL = RES_DATES[0] || '';
    } catch(e){ RES_DATES = []; }
  }
  if (!RES_DATES.length){
    page().innerHTML = h + '<p class="sub">No results loaded yet.</p>'; return; }
  h += '<select class="meet-pick" id="resDate">';
  RES_DATES.forEach(d => {
    const lbl = d === RES_DATES[0] ? d + ' (latest)' : d;
    h += `<option value="${d}" ${d===RES_SEL?'selected':''}>${lbl}</option>`;
  });
  h += '</select><div id="resBody"><p class="sub">Loading…</p></div>';
  page().innerHTML = h;
  document.getElementById('resDate').onchange = e => {
    RES_SEL = e.target.value; paintResults();
  };
  paintResults();
}
async function paintResults(){
  const body = document.getElementById('resBody');
  if (!body) return;
  let day;
  try {
    const r = await fetch('results/' + RES_SEL + '.json', {cache:'no-store'});
    day = await r.json();
  } catch(e){ body.innerHTML = '<p class="sub">Couldn’t load that day.</p>'; return; }
  let h = '';
  (day.meetings||[]).forEach(m => {
    h += `<div class="meeting"><h3>${m.track} <span class="cond">${m.country||''}</span></h3>`;
    (m.races||[]).forEach(r => {
      h += `<div class="race"><div class="race-line"><b>${r.race_no}</b></div><div class="board">`;
      (r.placings||[]).forEach(p => {
        h += `<div class="brow"><span class="r">${p.pos}. #${p.no} <b>${p.horse}</b></span>` +
             `<span class="o">${p.win?('$'+p.win.toFixed(2)+' win'):''}` +
             `${p.place?('  $'+p.place.toFixed(2)+' plc'):''}</span></div>`;
      });
      const ex = r.exotics||{};
      const exl = Object.keys(ex).map(k => `${k} $${(ex[k]||0).toFixed(2)}`).join('  ·  ');
      if (exl) h += `<div class="exotics">${exl}</div>`;
      h += '</div></div>';
    });
    h += '</div>';
  });
  body.innerHTML = h || '<p class="sub">No races for that day.</p>';
}

/* ---------------------------------------------- horse stats (search) */
let HORSES = null;
async function renderHorses(){
  let h = tabs() + '<h2>Horse stats</h2>' +
    '<div class="sub">search any horse — record, recent runs, sectional times</div>' +
    '<input class="meet-pick" id="hSearch" placeholder="Type a horse name…" autocomplete="off" />' +
    '<div id="hBody"></div>';
  page().innerHTML = h;
  const inp = document.getElementById('hSearch');
  inp.focus();
  inp.oninput = () => runHorseSearch(inp.value);
  if (!HORSES){
    document.getElementById('hBody').innerHTML = '<p class="sub">Loading the form book (one-off, a moment)…</p>';
    try {
      const r = await fetch('horses.json', {cache:'force-cache'});
      HORSES = (await r.json()).horses || [];
    } catch(e){ HORSES = []; }
    document.getElementById('hBody').innerHTML = '';
  }
}
function runHorseSearch(q){
  const body = document.getElementById('hBody');
  q = (q||'').trim().toLowerCase();
  if (q.length < 2){ body.innerHTML = '<p class="sub">Type at least two letters.</p>'; return; }
  const hits = (HORSES||[]).filter(h => (h.name||'').toLowerCase().includes(q)).slice(0, 12);
  if (!hits.length){ body.innerHTML = '<p class="sub">No horse by that name in our data.</p>'; return; }
  body.innerHTML = hits.map(horseCard).join('');
}
function horseCard(h){
  const rec = `${h.starts} starts · ${h.wins}W ${h.secs||0}‑${h.thirds||0}`;
  let s = `<div class="meeting"><h3>${h.name} <span class="cond">${rec}</span></h3>`;
  if (h.sect)
    s += `<div class="conf-line">Best sectionals we hold — 600m ${h.sect.l600}s · ` +
         `400m ${h.sect.l400}s · 200m ${h.sect.l200}s</div>`;
  if (h.runs && h.runs.length){
    s += '<div class="board">';
    h.runs.forEach(r => {
      const d = (r.date||'').slice(0,10);
      const run = r.run ? r.run.replace(/finish,\d+;?/,'').replace(/;/g,' ').trim() : '';
      s += `<div class="brow"><span class="r">${d} ${r.track||''}</span>` +
           `<span class="p">${r.dist||''}m ${r.going||''} · ` +
           `fin ${r.fin}/${r.field||'?'}${r.margin!=null?(' · '+r.margin+'L'):''}` +
           `${r.sp?(' · $'+r.sp):''}${run?(' · '+run):''}</span></div>`;
    });
    s += '</div>';
  } else {
    s += '<div class="conf-line">No detailed form stored for this one yet.</div>';
  }
  return s + '</div>';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t){ TAB = t.getAttribute('data-t'); renderTab(); }
});

async function boot(){
  if (!hasAccess()) return renderGate();
  page().innerHTML = '<p class="sub" style="margin-top:40px">Loading the desk…</p>';
  try {
    const [a, b] = await Promise.all([
      fetch('../app/data.json', {cache:'no-store'}),
      fetch('archive.json', {cache:'no-store'}).catch(() => null),
    ]);
    DATA = await a.json();
    ARCHIVE = b && b.ok ? await b.json() : {days: []};
  } catch(e){
    page().innerHTML = '<p class="sub" style="margin-top:40px">Couldn’t load — check your connection and refresh.</p>';
    return;
  }
  renderTab();
}
boot();
</script>
