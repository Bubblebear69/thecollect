<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Collect — members</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="../app/icon.svg" type="image/svg+xml" />
<style>
  :root{
    --ink:#0E1217; --card:#161E27; --line:rgba(212,175,55,.16);
    --gold:#D4AF37; --gold-hi:#F0D078; --turf:#1C8A50; --turf-deep:#0B3D2E;
    --paper:#F2EAD3; --dim:rgba(242,234,211,.68); --faint:rgba(242,234,211,.42);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--ink); color:var(--paper);
        font:15.5px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a{ color:var(--gold); text-decoration:none; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 20px; }

  .top{ position:sticky; top:0; z-index:50; background:rgba(14,18,23,.94);
        backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top .wrap{ display:flex; align-items:center; gap:12px; height:60px; }
  .top img{ width:32px; height:32px; border-radius:8px; }
  .top .name{ font-family:Georgia,serif; font-weight:700; font-size:17px; }
  .top .spacer{ flex:1; }
  .top a.plain{ color:var(--dim); font-size:13.5px; margin-left:14px; }

  .tabs{ display:flex; gap:6px; margin:22px 0 6px; flex-wrap:wrap; }
  .tabs button{ background:var(--card); color:var(--dim); border:1px solid var(--line);
        border-radius:999px; padding:9px 20px; font-size:14px; font-weight:700;
        cursor:pointer; }
  .tabs button.on{ background:linear-gradient(135deg,var(--gold-hi),var(--gold));
        color:#171204; border-color:transparent; }

  h2{ font-family:Georgia,serif; font-size:24px; margin:22px 0 4px; }
  .sub{ color:var(--faint); font-size:13px; margin-bottom:14px; }

  /* ---- Today's card: racing-native treatment ---- */
  .track-band{ display:flex; align-items:baseline; gap:12px; margin:16px 0 12px;
        padding-bottom:8px; border-bottom:1px solid var(--line); }
  .track-name{ font-family:Georgia,serif; font-size:22px; font-weight:700; }
  .track-cond{ font-size:12.5px; color:var(--faint); text-transform:uppercase;
        letter-spacing:1px; }
  .rc{ background:var(--card); border:1px solid var(--line); border-radius:16px;
        padding:0; margin-bottom:16px; overflow:hidden; }
  .rc-head{ display:flex; align-items:center; gap:12px; padding:14px 18px;
        background:rgba(212,175,55,.06); border-bottom:1px solid var(--line); }
  .rc-no{ font-family:Georgia,serif; font-weight:800; font-size:15px; color:#171204;
        background:linear-gradient(135deg,var(--gold-hi),var(--gold)); border-radius:7px;
        padding:3px 11px; letter-spacing:.5px; }
  .rc-name{ font-family:Georgia,serif; font-size:16px; font-weight:600; flex:1;
        min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rc-meta{ display:flex; gap:6px; flex-shrink:0; }
  .pill{ font-size:11.5px; font-weight:700; color:var(--dim); background:rgba(242,234,211,.07);
        border:1px solid var(--line); border-radius:999px; padding:3px 10px;
        font-variant-numeric:tabular-nums; }

  .saddle{ display:inline-flex; align-items:center; justify-content:center;
        font-weight:800; font-variant-numeric:tabular-nums; border-radius:7px;
        width:30px; height:34px; font-size:16px; flex-shrink:0;
        box-shadow:inset 0 -2px 0 rgba(0,0,0,.22); }
  .saddle-lg{ width:46px; height:52px; font-size:24px; border-radius:9px; }
  .s-pick{ background:linear-gradient(160deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
        color:#171204; }
  .s-danger{ background:linear-gradient(160deg,#E9906B,#C7643F); color:#1a0e07; }
  .s-chance{ background:linear-gradient(160deg,#5C7C90,#3C5568); color:#eaf2f7; }
  .s-out{ background:#2A333C; color:var(--dim); }

  .pick-hero{ display:flex; gap:15px; align-items:center; padding:16px 18px 12px; }
  .pick-body{ min-width:0; }
  .pick-name{ font-family:Georgia,serif; font-size:22px; font-weight:700;
        color:var(--gold-hi); line-height:1.15; display:flex; align-items:center;
        gap:9px; flex-wrap:wrap; }
  .ribbon{ font-size:10.5px; font-weight:800; letter-spacing:1px; color:#171204;
        background:linear-gradient(135deg,var(--gold-hi),var(--gold)); border-radius:5px;
        padding:3px 9px; }
  .chip-money{ font-size:10.5px; font-weight:800; letter-spacing:1px; color:var(--turf);
        background:rgba(28,138,80,.16); border:1px solid rgba(28,138,80,.5);
        border-radius:5px; padding:2px 8px; }
  .band{ font-size:10.5px; font-weight:800; letter-spacing:.6px; border-radius:5px; padding:3px 9px; }
  .band-higher{ color:var(--turf); background:rgba(28,138,80,.16); border:1px solid rgba(28,138,80,.5); }
  .band-lower{ color:#B8860B; background:rgba(184,134,11,.15); border:1px solid rgba(184,134,11,.5); }
  .band-note{ font-size:12px; color:var(--muted,#8a94a0); margin-top:6px; line-height:1.45; }
  .pick-conf{ display:flex; align-items:center; gap:10px; margin-top:7px; }
  .medallion{ display:inline-flex; align-items:center; justify-content:center;
        width:34px; height:34px; border-radius:50%; font-weight:800; font-size:14px;
        color:var(--gold-hi); border:2px solid var(--gold); background:rgba(212,175,55,.1);
        flex-shrink:0; }
  .pick-conf .conf-line{ margin:0; }

  .verdict{ font-weight:700; font-size:15px; padding:0 18px; margin:4px 0 2px; }
  .rc .why{ padding:0 18px; margin:2px 0 6px; }
  .rc .market-read{ margin:8px 18px; }

  .field{ padding:8px 18px 14px; }
  .field-head{ font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
        color:var(--faint); margin:4px 0 8px; }
  .frow{ display:flex; gap:12px; align-items:flex-start; padding:7px 0;
        border-top:1px solid rgba(242,234,211,.06); }
  .frow-txt{ min-width:0; }
  .frow-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14.5px; }
  .frow-lab{ font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
        border-radius:4px; padding:1px 7px; }
  .frow-lab.s-pick{ background:rgba(212,175,55,.16); color:var(--gold); }
  .frow-lab.s-danger{ background:rgba(224,123,84,.16); color:#E9906B; }
  .frow-lab.s-chance{ background:rgba(92,124,144,.18); color:#9DBCCE; }
  .frow-lab.s-out{ background:rgba(242,234,211,.07); color:var(--faint); }
  .frow-c{ display:block; color:var(--dim); font-size:13px; margin-top:1px; }

  .exo{ display:flex; gap:10px; flex-wrap:wrap; padding:2px 18px 16px; }
  .exo-ticket{ font-size:13px; color:var(--dim); background:rgba(242,234,211,.04);
        border:1px dashed var(--line); border-radius:8px; padding:8px 12px; flex:1;
        min-width:230px; }
  .exo-k{ display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase;
        color:var(--gold); font-weight:800; margin-bottom:2px; }
  @media(prefers-reduced-motion:no-preference){
    .pick-hero .saddle-lg{ transition:transform .15s ease; }
    .rc:hover .saddle-lg{ transform:translateY(-1px); }
  }
  /* ---- Results: podium treatment ---- */
  .pill-win{ background:linear-gradient(135deg,var(--gold-hi),var(--gold));
        color:#171204; border:0; }
  .placings{ padding:8px 18px 12px; }
  .pl-row{ display:flex; align-items:center; gap:12px; padding:8px 0;
        border-top:1px solid rgba(242,234,211,.06); }
  .pl-1{ background:linear-gradient(160deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
        color:#171204; }
  .pl-2{ background:linear-gradient(160deg,#DBE0E6,#9AA3AD); color:#1a1e22; }
  .pl-3{ background:linear-gradient(160deg,#D3A06E,#A0693C); color:#1a0e05; }
  .pl-4{ background:#2A333C; color:var(--dim); }
  .pl-txt{ flex:1; min-width:0; font-size:14.5px; }
  .pl-pos{ font-size:11px; font-weight:800; letter-spacing:.5px; color:var(--faint);
        text-transform:uppercase; margin-right:5px; }
  .pl-div{ font-size:12.5px; color:var(--faint); white-space:nowrap;
        font-variant-numeric:tabular-nums; }
  .pl-div .dv{ color:var(--gold-hi); font-weight:800; }
  .ourpick{ display:flex; align-items:center; gap:10px; margin:0 18px;
        padding:9px 12px; border-radius:0 8px 8px 0; border-left:3px solid; font-size:13.5px; }
  .ourpick-won{ background:rgba(212,175,55,.14); border-color:var(--gold); }
  .ourpick-plc{ background:rgba(28,138,80,.12); border-color:var(--turf); }
  .ourpick-out{ background:rgba(242,234,211,.04); border-color:rgba(242,234,211,.2); }
  .op-lab{ font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
        color:var(--faint); }
  .op-horse{ flex:1; min-width:0; font-weight:700; }
  .op-badge{ font-size:11.5px; font-weight:800; letter-spacing:.5px; padding:2px 10px;
        border-radius:5px; white-space:nowrap; }
  .ourpick-won .op-badge{ background:linear-gradient(135deg,var(--gold-hi),var(--gold));
        color:#171204; }
  .ourpick-plc .op-badge{ background:rgba(28,138,80,.2); color:#8FD9AE; }
  .ourpick-out .op-badge{ background:rgba(242,234,211,.08); color:var(--faint); }
  .pl-ours{ background:rgba(212,175,55,.05); }
  .in-top3{ font-size:9.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
        color:var(--gold); background:rgba(212,175,55,.14); border-radius:4px;
        padding:1px 7px; margin-left:8px; vertical-align:1px; }
  .exo-hit{ border-style:solid; border-color:rgba(28,138,80,.6);
        background:rgba(28,138,80,.14); }
  .exo-hit .exo-k{ color:#8FD9AE; }
  .hit-tag{ font-size:9px; font-weight:800; letter-spacing:.5px; color:#08130c;
        background:linear-gradient(135deg,#5FCf8f,var(--turf)); border-radius:3px;
        padding:1px 6px; margin-left:6px; }
  .pl-winner{ background:rgba(212,175,55,.12); border-radius:8px;
        margin:2px -6px; padding-left:6px; padding-right:6px; }
  .pl-winner .pl-txt b{ font-size:16px; color:var(--gold-hi); }
  .pl-winner .saddle{ width:38px; height:42px; font-size:20px; }
  .our-order{ padding:8px 18px 16px; font-size:13px; color:var(--faint);
        font-variant-numeric:tabular-nums; }
  .our-order b{ color:var(--paper); font-weight:700; }
  /* ---- wow-factor features ---- */
  .dial{ margin-left:auto; align-self:center; flex-shrink:0; }
  .pick-hero{ align-items:center; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
  @media(prefers-reduced-motion:no-preference){ .live-pulse{ animation:pulse 1.3s ease-in-out infinite; } }
  .ntj-head{ display:flex; align-items:center; gap:5px; }
  .ntj-when.imminent{ color:#E9906B; }
  .ntj-fire{ margin-left:2px; }
  .beat{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
        padding:8px 18px 14px; }
  .beat-lab{ font-size:12px; color:var(--faint); font-weight:700; }
  .beat-nums{ display:flex; gap:5px; flex-wrap:wrap; }
  .beat-n{ min-width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
        background:var(--card); color:var(--dim); font-weight:800; font-size:13px; cursor:pointer;
        font-variant-numeric:tabular-nums; }
  .beat-n.on{ background:linear-gradient(135deg,#5FCf8f,var(--turf)); color:#08130c; border-color:transparent; }
  .beat-n:hover{ border-color:var(--gold); }
  .vs .vs-row{ display:flex; align-items:stretch; gap:0; padding:14px 18px; }
  .vs-side{ flex:1; text-align:center; }
  .vs-n{ font-size:30px; font-weight:800; color:var(--paper); font-variant-numeric:tabular-nums; }
  .vs-n span{ font-size:16px; color:var(--faint); }
  .vs-side.gold .vs-n{ color:var(--gold-hi); }
  .vs-l{ font-size:11px; color:var(--faint); letter-spacing:.5px; }
  .vs-p{ font-size:15px; font-weight:700; color:var(--dim); margin-top:2px; }
  .vs-v{ align-self:center; color:var(--faint); font-weight:800; padding:0 14px; }
  @keyframes reveal{ from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none} }
  @media(prefers-reduced-motion:no-preference){
    .pl-winner{ animation:reveal .5s cubic-bezier(.2,.8,.2,1) both; }
    .pl-winner .saddle{ animation:reveal .6s .1s cubic-bezier(.2,.8,.2,1) both; }
    .exo-hit{ animation:reveal .5s .2s both; }
  }
  /* ---- Our picks (day boards) ---- */
  .day-sum{ display:flex; align-items:center; gap:12px; padding:14px 18px;
        cursor:pointer; list-style:none; flex-wrap:wrap; }
  .day-sum::-webkit-details-marker{ display:none; }
  .day-sum::after{ content:"+"; color:var(--gold); font-size:18px; margin-left:auto; }
  details[open] .day-sum::after{ content:"–"; }
  .day-date{ font-family:Georgia,serif; font-weight:700; font-size:16px; }
  .day-stat{ font-size:13.5px; color:var(--dim); }
  .day-w{ color:var(--gold-hi); font-size:16px; }
  .day-pct{ color:var(--faint); }
  .day-best{ font-size:12.5px; color:var(--faint); }
  .day-best b{ color:var(--gold-hi); }
  .ob-won{ background:linear-gradient(135deg,var(--gold-hi),var(--gold)); color:#171204; }
  .ob-plc{ background:rgba(28,138,80,.2); color:#8FD9AE; }
  .ob-out{ background:rgba(242,234,211,.08); color:var(--faint); }
  /* ---- Blackbook ---- */
  .bb-head.bb-quiet{ background:rgba(212,175,55,.08); }
  .bb-head.bb-bias{ background:rgba(92,124,144,.1); }
  .bb-note{ padding:8px 18px 2px; color:var(--dim); font-size:13.5px; font-style:italic; }
  .bb-star{ background:transparent; border:0; color:var(--faint); font-size:20px;
        cursor:pointer; padding:0 2px; line-height:1; flex-shrink:0; align-self:center; }
  .bb-star.on{ color:var(--gold-hi); }
  .bb-star:hover{ color:var(--gold); }
  .bb-input{ width:100%; margin-top:4px; background:rgba(242,234,211,.04);
        border:1px solid var(--line); border-radius:7px; padding:6px 10px;
        color:var(--paper); font-size:13px; }
  .bb-input:focus{ outline:none; border-color:var(--gold); }
  .bb-del{ background:transparent; border:1px solid var(--line); color:var(--faint);
        border-radius:7px; padding:4px 10px; font-size:11.5px; cursor:pointer;
        white-space:nowrap; align-self:center; }
  .bb-del:hover{ color:#E9906B; border-color:#E07B54; }
  .bb-seen{ font-size:11.5px; color:var(--faint); white-space:nowrap; }
  /* ---- Horse stats ---- */
  .hs-rec{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:14px 18px 4px; }
  .hs-tile{ background:rgba(242,234,211,.04); border:1px solid var(--line);
        border-radius:10px; padding:9px 4px; text-align:center; }
  .hs-n{ font-size:20px; font-weight:800; color:var(--gold-hi); font-variant-numeric:tabular-nums; }
  .hs-l{ font-size:10.5px; color:var(--faint); }
  .hs-sect{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px 18px 0; }
  .hs-sect-k{ font-size:10.5px; letter-spacing:.8px; text-transform:uppercase;
        color:var(--gold); font-weight:800; margin-right:2px; }
  .hs-read{ margin:10px 18px 2px; padding:10px 13px; border-radius:0 8px 8px 0;
        background:rgba(212,175,55,.07); border-left:3px solid var(--gold);
        font-size:13.5px; color:var(--paper); }
  .hs-runs-head{ font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase;
        color:var(--faint); padding:12px 18px 0; }
  /* ---- King-Zone-beaters ---- */
  .steer{ display:flex; gap:9px; align-items:flex-start; margin:8px 18px;
        padding:8px 12px; border-radius:0 8px 8px 0; font-size:13px; color:var(--dim);
        background:rgba(224,123,84,.1); border-left:3px solid #E07B54; }
  .steer-x{ color:#E9906B; font-weight:800; }
  .steer b{ color:#E9906B; }
  .roughie{ border-color:rgba(212,175,55,.4); }
  .roughie .rc-no{ background:linear-gradient(135deg,#E9906B,#C7643F); color:#1a0e07; }
  .ntj{ margin:14px 0; }
  .ntj-head{ font-size:11px; letter-spacing:1.4px; text-transform:uppercase;
        color:var(--gold); font-weight:800; margin-bottom:8px; }
  .ntj-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .ntj-card{ flex:0 0 auto; min-width:140px; background:var(--card);
        border:1px solid var(--line); border-radius:12px; padding:11px 14px; }
  .ntj-when{ font-size:19px; font-weight:800; color:var(--gold-hi);
        font-variant-numeric:tabular-nums; }
  .ntj-race{ font-size:11.5px; color:var(--faint); margin-top:1px; }
  .ntj-pick{ font-size:13.5px; font-weight:700; margin-top:5px;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .print-btn{ margin-left:auto; background:transparent; color:var(--dim);
        border:1px solid var(--line); border-radius:8px; padding:6px 12px;
        font-size:12.5px; font-weight:700; cursor:pointer; }
  .print-btn:hover{ color:var(--gold-hi); border-color:var(--gold); }
  @media print{
    body{ background:#fff; color:#111; }
    .top, .tabs, .meet-pick, .print-btn, .ntj, footer{ display:none !important; }
    .rc, .track-band{ break-inside:avoid; border-color:#ccc; background:#fff; }
    .pick-name, .rc-name, .track-name{ color:#111 !important; }
    .why, .verdict, .conf-line, .frow-c, .market-read{ color:#222 !important; }
    .saddle{ box-shadow:none; }
  }
  .meeting{ background:var(--card); border:1px solid var(--line); border-radius:16px;
            padding:20px 22px; margin-bottom:18px; }
  .meeting > h3{ font-size:18px; display:flex; gap:10px; align-items:baseline; }
  .meeting > h3 .cond{ font-size:12px; color:var(--faint); font-weight:400; }
  .race{ border-top:1px solid rgba(242,234,211,.08); margin-top:14px; padding-top:14px; }
  .race-line{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .race-line b{ font-size:15.5px; }
  .race-line .t{ color:var(--faint); font-size:12.5px; }
  .hero-in{ padding:26px 4px 8px; }
  .hero-in h1{ font-family:Georgia,serif; font-size:clamp(28px,5vw,40px);
        line-height:1.12; font-weight:700; }
  .hero-in h1 span{ color:var(--gold); }
  .hero-in .lead{ color:var(--dim); font-size:16px; max-width:640px; margin-top:10px; }
  .tile-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:12px 0; }
  .tile{ background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:16px 14px; text-align:center; }
  .tile .tn{ font-size:clamp(20px,3.4vw,28px); font-weight:800; color:var(--gold-hi);
        font-variant-numeric:tabular-nums; }
  .tile .tl{ font-size:11.5px; color:var(--faint); margin-top:3px; letter-spacing:.3px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px;
        padding:22px 24px; margin:16px 0; }
  .panel h3{ font-family:Georgia,serif; font-size:20px; margin-bottom:10px; }
  ul.how{ list-style:none; display:grid; gap:11px; }
  ul.how li{ padding-left:22px; position:relative; font-size:14.5px; color:var(--dim); }
  ul.how li b{ color:var(--paper); }
  ul.how li::before{ content:"◆"; position:absolute; left:0; color:var(--gold);
        font-size:11px; top:3px; }
  .panel.learn{ background:linear-gradient(135deg,var(--turf-deep),#123526 55%,var(--card));
        border-color:rgba(28,138,80,.4); }
  .panel.learn p{ color:var(--paper); font-size:15px; margin-bottom:10px; }
  .panel.learn b{ color:var(--gold-hi); }
  .cta-in{ text-align:center; margin:8px 0 24px; }
  .go-today{ background:linear-gradient(135deg,var(--gold-hi),var(--gold)); color:#171204;
        border:0; border-radius:10px; padding:13px 26px; font-size:15px; font-weight:800;
        cursor:pointer; }
  @media(max-width:560px){ .tile-row{ grid-template-columns:repeat(3,1fr); }
        .tile .tn{ font-size:19px; } .tile .tl{ font-size:10px; } }
  .meet-pick{ margin:6px 0 4px; padding:11px 14px; border-radius:10px; font-size:15px;
        font-weight:700; background:var(--card); color:var(--paper);
        border:1px solid var(--line); width:100%; max-width:420px; cursor:pointer; }
  .grade{ font-size:12px; font-weight:800; color:#171204; background:var(--gold);
          border-radius:6px; padding:1px 8px; margin-left:8px; vertical-align:2px; }

/* ---- personal blackbook (on-device, shared with the phone app) ---- */
function esc(s){ return String(s||'').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bbList(){ try { return JSON.parse(localStorage.getItem('tc_blackbook')||'[]'); }
                  catch(e){ return []; } }
function bbSave(l){ localStorage.setItem('tc_blackbook', JSON.stringify(l)); }
function bbHas(horse){ return bbList().some(x => x.horse === horse); }
function bbToggle(horse){
  const l = bbList(); const i = l.findIndex(x => x.horse === horse);
  if (i >= 0) l.splice(i, 1);
  else l.push({horse: horse, note: '',
               added: new Date().toISOString().slice(0,10)});
  bbSave(l);
}
function bbStar(horse){
  return `<button class="bb-star${bbHas(horse)?' on':''}" data-bb="${esc(horse)}"` +
         ` title="Blackbook this runner">${bbHas(horse)?'★':'☆'}</button>`;
}

/* ---- Beat the Collect (on-device: your tip vs ours) ---- */
function btcTips(){ try { return JSON.parse(localStorage.getItem('tc_mytips')||'{}'); } catch(e){ return {}; } }
function btcTip(rkey){ return btcTips()[rkey]; }
function btcSet(rkey, no){
  const t = btcTips();
  if (t[rkey] === no) delete t[rkey]; else t[rkey] = no;
  localStorage.setItem('tc_mytips', JSON.stringify(t));
}
function btcTally(){ try { return JSON.parse(localStorage.getItem('tc_mytally')||
  '{"myW":0,"myN":0,"ourW":0,"ourN":0,"done":[]}'); } catch(e){
  return {myW:0,myN:0,ourW:0,ourN:0,done:[]}; } }
function btcScoreDay(day){
  // score any of the member's tips for this results day, once each
  const t = btcTips(), tally = btcTally();
  const done = new Set(tally.done);
  (day.meetings||[]).forEach(m => (m.races||[]).forEach(r => {
    const rkey = `${day.date}|${m.track}|${r.race_no}`;
    if (!(rkey in t) || done.has(rkey)) return;
    const winNo = (r.placings||[]).find(p => p.pos===1)?.no;
    if (winNo == null) return;
    tally.myN++; if (String(t[rkey]) === String(winNo)) tally.myW++;
    if (r.pick){ tally.ourN++; if (r.pick.won) tally.ourW++; }
    done.add(rkey);
  }));
  tally.done = [...done];
  localStorage.setItem('tc_mytally', JSON.stringify(tally));
}

  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'the-collect.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);

function wrapText(g, text, x, y, maxW, lh){
  const words = String(text).split(' '); let line = '', yy = y;
  for (const w of words){
    if (g.measureText(line + w).width > maxW && line){ g.fillText(line.trim(), x, yy); line = ''; yy += lh; }
    line += w + ' ';
  }
  g.fillText(line.trim(), x, yy);
}

/* ---- live jump ticker (updates every second) ---- */
let TICKER = null;
function startTicker(){
  if (TICKER) clearInterval(TICKER);
  TICKER = setInterval(() => {
    document.querySelectorAll('[data-jump]').forEach(el => {
      const t = parseInt(el.getAttribute('data-jump'), 10);
      const secs = Math.round((t - Date.now())/1000);
      if (secs <= -120){ el.textContent = 'off'; return; }
      if (secs <= 0){ el.textContent = 'JUMPING'; el.classList.add('imminent'); return; }
      const m = Math.floor(secs/60), s = secs%60;
      el.textContent = m>0 ? `${m}m ${String(s).padStart(2,'0')}s` : `${s}s`;
      if (secs <= 120) el.classList.add('imminent');
    });
  }, 1000);
}

function hasAccess(){ return localStorage.getItem('tc_access') === 'yes'; }

async function checkCode(code){
  const clean = (code||'').trim().toUpperCase();
  if (!clean) return false;
  const buf = await crypto.subtle.digest('SHA-256',
      new TextEncoder().encode(clean));
  const hex = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return DIGESTS.includes(hex);
}

function tile(n, label){
  return `<div class="tile"><div class="tn">${n==null?'—':n}</div>` +
         `<div class="tl">${label}</div></div>`;
}
function nextToJump(d){
  // upcoming races across all meetings, soonest first, with our pick
  const now = new Date();
  const rows = [];
  (d.meetings||[]).forEach(m => (m.races||[]).forEach(r => {
    if (!r.start_time) return;
    const t = new Date(d.date + 'T' + r.start_time);
    if (isNaN(t)) return;
    if (t.getTime() > now.getTime() - 120000)   // not long gone
      rows.push({t, track:m.track, race:r.race_no, pick:r.pick||{}});
  }));
  rows.sort((a,b) => a.t - b.t);
  const up = rows.slice(0, 5);
  if (!up.length) return '';
  let h = '<div class="ntj"><div class="ntj-head">⏱ Next to jump — live</div><div class="ntj-row">';
  up.forEach(x => {
    const firming = x.pick.firming ? '<span class="ntj-fire live-pulse">💰</span>' : '';
    h += `<div class="ntj-card"><div class="ntj-when" data-jump="${x.t.getTime()}">…</div>

      <div class="ntj-pick">#${x.pick.number||''} ${x.pick.horse||''} ${firming}</div></div>`;
  });
  return h + '</div></div>';
}

const CONF_TEXT = {

  "A":  "High confidence — strong, converging evidence.",

  "B":  "Moderate confidence — our pick, in a more open race.",
  "C":  "An open race — our pick by a narrow margin.",
};
const CONF_FRAC = {"A+":1.0,"A":0.82,"B+":0.66,"B":0.5,"C":0.32,"D":0.2};
// A speedo-style confidence dial — shows the engine's certainty at a glance.
function confDial(grade){
  const f = CONF_FRAC[(grade||"").trim()] ?? 0.4;
  const a = Math.PI * (1 - f);                 // 180deg sweep, left=low
  const r = 26, cx = 30, cy = 30;
  const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  const col = f >= 0.8 ? '#5FCF8f' : f >= 0.55 ? '#D4AF37' : '#E9906B';
  return `<svg class="dial" viewBox="0 0 60 34" width="62" height="35" aria-hidden="true">
    <path d="M4 30 A26 26 0 0 1 56 30" fill="none" stroke="rgba(242,234,211,.14)" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 30 A26 26 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="2"/>
    <circle cx="30" cy="30" r="3" fill="${col}"/>
    <text x="30" y="20" text-anchor="middle" font-size="10" font-weight="800" fill="${col}">${(grade||'').trim()}</text>
  </svg>`;
}

function runHorseSearch(q){
  const body = document.getElementById('hBody');
  q = (q||'').trim().toLowerCase();
  if (q.length < 2){ body.innerHTML = '<p class="sub">Type at least two letters.</p>'; return; }
  const hits = (HORSES||[]).filter(h => (h.name||'').toLowerCase().includes(q)).slice(0, 12);

  body.innerHTML = hits.map(horseCard).join('');

const GOING = {G:'Good', S:'Soft', H:'Heavy', F:'Firm', A:'Synthetic', D:'Dirt'};
function goingWord(code){
  if (!code) return '';
  const m = code.match(/^([A-Za-z])\s*(\d+)?/);
  if (!m) return code;
  const w = GOING[m[1].toUpperCase()] || code;
  return w + (m[2] ? ' ' + m[2] : '');
}
function ordn(n){ n=parseInt(n,10); if(!n) return '';
  const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function runLine(raw){
  // 'finish,10;settling_down,4;m800,4;m400,7;' -> readable running story
  if (!raw) return '';
  const p = {}; raw.split(';').forEach(seg => {
    const [k,v] = seg.split(','); if(k&&v) p[k.trim()] = parseInt(v,10);
  });
  const bits = [];
  if (p.settling_down) bits.push('settled ' + ordn(p.settling_down));
  if (p.m800) bits.push(ordn(p.m800) + ' at the 800m');
  if (p.m400) bits.push(ordn(p.m400) + ' at the 400m');
  return bits.join(', ');
}
function horseRead(h){
  const st=h.starts||0, w=h.wins||0, pl=(h.secs||0)+(h.thirds||0);
  let form = '';
  if (st){
    form = `${st} recent start${st>1?'s':''} for ${w} win${w!==1?'s':''}`;
    if (pl) form += ` and ${pl} placing${pl>1?'s':''}`;
  }
  let ours = '';
  const s = h.seen;
  if (s && s.n){
    if (s.pick) ours = `We've made it our top pick ${s.pick} time${s.pick>1?'s':''} in the races we've covered.`;
    else if (s.top3) ours = `We've had it in our top three ${s.top3} time${s.top3>1?'s':''} in our window, without putting it up as the pick.`;
    else ours = `It's come under our eye ${s.n} time${s.n>1?'s':''} in our window; we've yet to fancy it.`;
  } else {
    ours = "It hasn't run in a meeting we've rated yet.";
  }
  return (form ? form + '. ' : '') + ours;
}
function horseCard(h){
  let s = `<article class="rc">
    <header class="rc-head"><span class="rc-name">${h.name}</span></header>
    <div class="hs-rec">
      <div class="hs-tile"><div class="hs-n">${h.starts||0}</div><div class="hs-l">recent runs</div></div>
      <div class="hs-tile"><div class="hs-n">${h.wins||0}</div><div class="hs-l">wins</div></div>
      <div class="hs-tile"><div class="hs-n">${h.secs||0}</div><div class="hs-l">2nds</div></div>
      <div class="hs-tile"><div class="hs-n">${h.thirds||0}</div><div class="hs-l">3rds</div></div>
    </div>
    <div class="hs-read">${horseRead(h)}</div>`;
  if (h.sect)
    s += `<div class="hs-sect"><span class="hs-sect-k">Fastest closing splits we hold</span>
      <span class="pill">last 600m ${h.sect.l600}s</span>
      <span class="pill">last 400m ${h.sect.l400}s</span>
      <span class="pill">last 200m ${h.sect.l200}s</span></div>`;
  if (h.runs && h.runs.length){
    s += '<div class="hs-runs-head">Recent form</div><div class="placings">';
    h.runs.forEach(r => {
      const d = (r.date||'').slice(0,10);
      const fin = parseInt(r.fin,10);
      const badge = fin>=1 && fin<=4 ? 'pl-'+fin : 'pl-4';
      const story = runLine(r.run);
      const detail = [
        (r.dist?r.dist+'m':'') + (r.going?(' '+goingWord(r.going)):''),
        r.cls || '',
        r.field ? `finished ${ordn(r.fin)} of ${r.field}` : (r.fin?('finished '+ordn(r.fin)):''),
        (r.margin!=null && fin>1) ? ('beaten '+r.margin+'L') : (fin===1?'won':''),
        story,
      ].filter(Boolean).join(' · ');
      s += `<div class="pl-row">
        <span class="saddle ${badge}">${r.fin||'·'}</span>
        <div class="pl-txt"><span class="pl-pos">${d} · ${r.track||''}</span>
          <span class="frow-c">${detail}</span></div>` +
        (r.sp ? `<span class="pl-div">SP <span class="dv">$${r.sp}</span></span>` : '') +
      `</div>`;
    });
    s += '</div>';
  } else {
    s += '<div class="bb-note">No detailed form stored for this one yet.</div>';
  }
  return s + '</article>';
}

document.addEventListener('click', e => {
  const btc = e.target.closest('[data-btc]');
  if (btc){ e.preventDefault();
    btcSet(btc.getAttribute('data-btc'), btc.getAttribute('data-no'));
    const on = btc.classList.contains('on');
    btc.parentElement.querySelectorAll('.beat-n.on').forEach(x => x.classList.remove('on'));
    if (!on) btc.classList.add('on');
    return; }
  if (e.target.closest('#shareCard')){ e.preventDefault(); collectCard(); return; }
  const bb = e.target.closest('[data-bb]');
  if (bb){ e.preventDefault(); bbToggle(bb.getAttribute('data-bb'));
           // update just the star, no full re-render (keeps scroll)
           bb.classList.toggle('on'); bb.textContent = bb.classList.contains('on')?'★':'☆';
           return; }
  const del = e.target.closest('[data-bbdel]');
  if (del){ const l = bbList(); l.splice(+del.getAttribute('data-bbdel'), 1);
            bbSave(l); renderBlackbook(); return; }
  const t = e.target.closest('[data-t]');
  if (t){ TAB = t.getAttribute('data-t'); renderTab(); }
});
document.addEventListener('change', e => {
  const n = e.target.closest('[data-bbnote]');
  if (n){ const l = bbList(); const i = +n.getAttribute('data-bbnote');
          if (l[i]){ l[i].note = n.value; bbSave(l); } }
});

async function boot(){
  if (!hasAccess()) return renderGate();
  page().innerHTML = '<p class="sub" style="margin-top:40px">Loading the desk…</p>';
  try {
    const [a, b] = await Promise.all([
      fetch('../app/data.json', {cache:'no-store'}),
      fetch('archive.json', {cache:'no-store'}).catch(() => null),
    ]);
    DATA = await a.json();
    ARCHIVE = b && b.ok ? await b.json() : {days: []};
  } catch(e){
    page().innerHTML = '<p class="sub" style="margin-top:40px">Couldn’t load — check your connection and refresh.</p>';
    return;
  }
  renderTab();
}
boot();
</script>
